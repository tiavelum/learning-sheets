name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check and render the sheets
    runs-on: ubuntu-24.04
    env:
      # The renderer takes Playwright's Chromium in CI, the browser the PDFs of
      # a release come from, even where the runner image names another Chrome.
      CHROME_PATH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Install the dependencies
        run: npm ci

      - name: Check the formatting and lint
        run: npx biome ci .

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test the scripts
        run: npm test

      - name: Check the sheet folders
        run: npm run check

      - name: Render every sheet
        run: npm run render

      - name: Attach the PDFs to the run
        if: ${{ hashFiles('build/*.pdf') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheets
          path: build/*.pdf
          if-no-files-found: error
