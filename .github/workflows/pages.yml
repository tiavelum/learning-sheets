name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets another workflow build and deploy the page; the caller grants
  # contents: read, pages: write and id-token: write.
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build the browse page
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    env:
      # The images of page one come from Playwright's Chromium, as the PDFs of
      # a release do, even where the runner image names another Chrome.
      CHROME_PATH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Install the dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run site -- --require-release-lookup

      - name: Upload the page as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

      - name: Find whether Pages deploys from this workflow
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enable="Enable it under Settings, Pages, Build and deployment, Source: GitHub Actions; the next run deploys the page."
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice title=Page not deployed::The page is built from $GITHUB_REF and deploys only from main."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "404" ]; then
            echo "::notice title=Page not deployed::GitHub Pages is not enabled for this repository. $enable"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" != "200" ]; then
            echo "::error title=Pages unknown::The Pages settings could not be read: HTTP $status."
            exit 1
          elif [ "$(jq -r .build_type "$RUNNER_TEMP/pages.json")" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Page not deployed::GitHub Pages publishes from a branch, not from this workflow. $enable"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy the browse page
    needs: build
    if: ${{ needs.build.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and a newer run waits for the one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
